<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Botones</title>

    <link rel="stylesheet" href="styles.css">


    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>
    <main>
        <div class="container">
            <div class="row">
                <div class="col-md-6">
                    <h3>1.Fundamentos y colores-basico</h3>
                    <button class="btn-primary">primario</button>
                    <button class="btn-secondary">secundario</button>
                    <button class="btn-success">éxito</button>
                    <button class="btn-danger">peligro</button>
                    <button class="btn-warning">advertencia</button>
                    <button class="btn-info">información</button>
                    <button class="btn-dark">oscuro</button>
                    <button class="btn-light">claro</button>
                    <button class="btn-text">texto</button>
                    <button class="btn-custom">personalizado</button>
                </div>
                <div class="col-md-6">
                    <h3>2.Bordes, tamaños y formas — básico</h3>
                    <button class="btn-outline">Contorno</button>
                    <button class="btn-border-thick">Borde grueso</button>
                    <button class="btn-border-dashed">Borde discontinuo</button>
                    <button class="btn-border-dotted">Borde punteado</button>
                    <button class="btn-rounded">Esquinas redondeadas</button>
                    <button class="btn-pill">Píldora</button>
                    <button class="btn-circle" aria-label="estrellita"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16"
                            fill="currentColor" class="bi bi-star" viewBox="0 0 16 16">
                            <path
                                d="M2.866 14.85c-.078.444.36.791.746.593l4.39-2.256 4.389 2.256c.386.198.824-.149.746-.592l-.83-4.73 3.522-3.356c.33-.314.16-.888-.282-.95l-4.898-.696L8.465.792a.513.513 0 0 0-.927 0L5.354 5.12l-4.898.696c-.441.062-.612.636-.283.95l3.523 3.356-.83 4.73zm4.905-2.767-3.686 1.894.694-3.957a.56.56 0 0 0-.163-.505L1.71 6.745l4.052-.576a.53.53 0 0 0 .393-.288L8 2.223l1.847 3.658a.53.53 0 0 0 .393.288l4.052.575-2.906 2.77a.56.56 0 0 0-.163.506l.694 3.957-3.686-1.894a.5.5 0 0 0-.461 0z" />
                        </svg>Circular</button>
                    <button class="btn-small">Pequeño</button>
                    <button class="btn-large">Grande</button>
                    <button class="btn-full">Ancho completo</button>
                </div>
            </div>
        </div>
    </main>

</body>

</html>
